[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "polarion-api"
version = "3.0.0"
description = "Polarion client for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Jesper Raemaekers", email = "j.raemaekers@relek.nl"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "lxml",
    "texttable",
    "requests",
]

[project.urls]
Homepage = "https://github.com/saggl/python-polarion"
"Bug Tracker" = "https://github.com/saggl/python-polarion/issues"
Documentation = "https://python-polarion.readthedocs.io/"

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["polarion*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
